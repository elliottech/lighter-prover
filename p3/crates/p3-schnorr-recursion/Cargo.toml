[package]
name = "p3-schnorr-recursion"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "../../README.md"

[features]
default = []
plonky2-nightly = ["dep:plonky2", "dep:starky", "dep:anyhow"]
reference = ["p3-schnorr/reference"]
# Exposes a deliberately unconstrained public-input-only circuit for tests and
# benchmarks. It is not a Schnorr verifier and must never be used in production.
insecure-test-only = ["plonky2-nightly"]

[dependencies]
p3-air.workspace = true
p3-challenger.workspace = true
p3-field.workspace = true
p3-commit.workspace = true
p3-fri.workspace = true
p3-goldilocks.workspace = true
p3-matrix.workspace = true
p3-schnorr = { path = "../p3-schnorr" }
p3-symmetric.workspace = true
p3-uni-stark.workspace = true
plonky2 = { git = "https://github.com/elliottech/plonky2", rev = "e1c2d35450948b88fca6a7e69e2643c3ecad3caa", package = "plonky2", optional = true }
starky = { git = "https://github.com/elliottech/plonky2", rev = "e1c2d35450948b88fca6a7e69e2643c3ecad3caa", package = "starky", optional = true }
anyhow = { version = "1.0.40", default-features = false, optional = true }
thiserror.workspace = true

[[example]]
name = "timing"
required-features = ["plonky2-nightly", "reference"]
