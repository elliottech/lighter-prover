[package]
name = "p3-schnorr"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "../../README.md"

[features]
default = ["parallel"]
parallel = [
    "p3-dft/parallel",
    "p3-uni-stark/parallel",
    "p3-util/parallel",
]
reference = ["dep:goldilocks-crypto"]
# Metal-accelerated Merkle leaf hashing and coset LDE (GPU NTT) in the
# STARK's trace/quotient commitments (Apple Silicon only; prover-side,
# digest/proof-compatible).
metal = ["p3-merkle-tree/metal", "dep:metal", "dep:objc", "dep:rayon"]

[dependencies]
bincode.workspace = true
goldilocks-crypto = { workspace = true, optional = true }
p3-air.workspace = true
p3-challenger.workspace = true
p3-commit.workspace = true
p3-dft.workspace = true
p3-field.workspace = true
p3-fri.workspace = true
p3-goldilocks.workspace = true
p3-matrix.workspace = true
p3-merkle-tree.workspace = true
p3-symmetric.workspace = true
p3-uni-stark.workspace = true
p3-util.workspace = true
thiserror.workspace = true

[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
metal = { version = "0.33.0", optional = true }
objc = { version = "0.2.7", optional = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
poseidon-hash.workspace = true
rayon.workspace = true
tracing = "0.1"
tracing-forest = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "air"
harness = false
required-features = ["reference"]

[[example]]
name = "timing"
required-features = ["reference"]

[[example]]
name = "stark_profile"
required-features = ["reference"]

[[test]]
name = "reference"
path = "tests/reference.rs"
required-features = ["reference"]
