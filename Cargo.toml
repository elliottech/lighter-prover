[workspace]
members = [
  "circuit",
  "bench",
  "desertexit/circuits",
  "p3/crates/p3-schnorr",
  "p3/crates/p3-schnorr-recursion",
]
exclude = ["plonky2"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Business Source License 1.1"

[workspace.dependencies]
anyhow = { version = "1.0.40", default-features = false }
hashbrown = { version = "0.14.3", default-features = false, features = [
  "ahash",
  "serde",
] }
itertools = { version = "0.13.0", default-features = false }
log = { version = "0.4.14", default-features = false }
num = { version = "0.4", default-features = false, features = [
  "rand",
  "serde",
] }
bincode = "1.3.3"
rand = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_with = { version = "3.8.3", features = ["hex"] }
serde_json = { version = "1.0", features = ["raw_value"] }
hex = { version = "0.4.3" }
rayon = "1.5.1"
plonky2 = { path = "plonky2/plonky2", package = "plonky2", default-features = false, features = [
  "gate_testing",
  "parallel",
  "rand_chacha",
  "std",
] }
lazy_static = "1.4.0"
env_logger = "0.11.3"
ff = { package = "ff", version = "0.13", features = ["derive"] }
paste = "1.0"
clap = { version = "4.5.21", features = ["derive"] }
clap_derive = { version = "4.0.0-rc.1" }

# p3 (Plonky3) dependencies for the vendored p3 crates under `p3/`
criterion = { version = "0.5", default-features = false }
goldilocks-crypto = "0.1.2"
p3-air = "0.6.3"
p3-challenger = "0.6.3"
p3-commit = "0.6.3"
p3-dft = "0.6.3"
p3-field = "0.6.3"
p3-fri = "0.6.3"
p3-goldilocks = "0.6.3"
p3-matrix = "0.6.3"
p3-merkle-tree = "0.6.0"
p3-symmetric = "0.6.3"
p3-uni-stark = "0.6.3"
p3-util = "0.6.3"
poseidon-hash = "0.1.4"
thiserror = "2"

# Dev dependencies
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

[profile.release]
incremental = true

# [patch."https://github.com/elliottech/plonky2.git"]
# plonky2={path = "../plonky2/plonky2"}

# Vendored copy of p3-merkle-tree 0.6.0 with an optional Metal-accelerated
# first digest layer (`metal` feature; Apple Silicon only, prover-side only).
[patch.crates-io]
p3-merkle-tree = { path = "p3/crates/p3-merkle-tree" }
